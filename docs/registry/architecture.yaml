# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: float_in_sim
    status: active
    description: "Sim state and sim computations must not use float, Vector2, Vector3, Transform2D/3D, Basis, Quaternion or Color, nor float-returning built-ins (sin, cos, sqrt, lerp, untyped abs/clamp/min/max). Floats are presentation-only, converted one-way from sim ints."
    why: "Cross-machine float bit-identity depends on toolchain details the project cannot test; Vector2/3 use 32-bit real_t. One divergent bit desyncs LAN and breaks replay checksums."
    adr: docs/architecture/adr-0001-sim-numeric-model.md
    added: 2026-11-01

  - pattern: raw_signed_division_in_sim
    status: active
    description: "Sim code must not use raw / or % where an operand can be negative; use SimMath.div_floor / mod_floor / mul_permille."
    why: "GDScript / truncates toward zero and % takes the dividend's sign (tested on 4.7.2); one tested rounding helper keeps every system on the same convention."
    adr: docs/architecture/adr-0001-sim-numeric-model.md
    added: 2026-11-01

  - pattern: signed_worldspace_ratio
    status: active
    description: "Facing-dependent quantities (knockback, displacement, velocity scaling, box offsets) must not be divided or scaled as signed world-space values; compute a non-negative facing-local magnitude and apply the facing sign last."
    why: "Floor division is not mirror-symmetric (div_floor(-5, 2) = -3 but -div_floor(5, 2) = -2), so left- and right-facing characters would get different results."
    adr: docs/architecture/adr-0001-sim-numeric-model.md
    added: 2026-11-01

  - pattern: engine_time_in_sim
    status: active
    description: "Sim code must not read delta, Time.*, OS.get_ticks_* or Engine.time_scale; the sim advances by its own integer tick counter."
    why: "Wall-clock time differs between machines and runs; the sim must be a pure function of inputs and tick count."
    adr: docs/architecture/adr-0001-sim-numeric-model.md
    added: 2026-11-01

  - pattern: engine_time_scale_in_match
    status: active
    description: "Engine.time_scale must never be changed while a match is running; presentation slow-mo is a presentation-only time scale on world-layer effects."
    why: "time_scale scales delta for every node, invites drift between presentation and the sim, and would slow the HUD, which must run on unscaled time."
    adr: docs/architecture/adr-0002-sim-view-split.md
    added: 2026-11-01

  - pattern: presentation_holds_sim_buffer
    status: active
    description: "Presentation code must not obtain, store or pass on the sim's PackedInt64Array; it reads only through SimView accessors."
    why: "PackedInt64Array is a reference type in GDScript (tested on 4.7.2): a held reference is the live sim buffer, and one write through it desyncs a single machine with no error."
    adr: docs/architecture/adr-0002-sim-view-split.md
    added: 2026-11-01

  - pattern: presentation_state_inference
    status: active
    description: "VFX, SFX and HUD cues must not be triggered by inferring events from state changes (e.g. HP went down, so play a hit); they fire only from the sim's tick-stamped event ring."
    why: "Inference double-fires or misses under multi-tick catch-up and future re-simulation; events are fired once by (tick, seq)."
    adr: docs/architecture/adr-0002-sim-view-split.md
    added: 2026-11-01

