# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: sim-core
    status: active
    budget_ms: 0.25
    adr: docs/architecture/adr-0001-sim-numeric-model.md
    notes: "Per sim tick, including snapshot and checksum; leaves room for ~8 re-simulated ticks inside the 2.0 ms sim slice (art bible 8.10, estimate) when rollback arrives"
    referenced_by:
      - docs/architecture/adr-0001-sim-numeric-model.md
    added: 2026-11-01
    revised: ""

# Example:
#
# performance_budgets:
#   - target_fps: 60
#     total_frame_budget_ms: 16.6
#     platform: PC             # PC | Console | Mobile | All
#     adr: docs/architecture/adr-0000-performance-targets.md
#     added: 2026-03-26
#     revised: ""
#
#   - system: combat
#     status: active
#     budget_ms: 2.0
#     adr: docs/architecture/adr-0003-combat-system.md
#     notes: "Includes physics queries, hitbox evaluation, and damage calculation"
#     referenced_by:
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: sim_state_storage
    status: active
    api: PackedInt64Array
    not: PackedInt32Array
    adr: docs/architecture/adr-0001-sim-numeric-model.md
    reason: "PackedInt32Array truncates silently on assignment (5000000000 becomes 705032704, tested on 4.7.2)"
    referenced_by:
      - docs/architecture/adr-0001-sim-numeric-model.md
    added: 2026-11-01
    revised: ""

  - purpose: sim_rng
    status: active
    api: SimRng (project-owned integer PRNG, state in the sim buffer)
    not: RandomNumberGenerator, randi, randf, randomize
    adr: docs/architecture/adr-0001-sim-numeric-model.md
    reason: "Engine RNG cross-version stability is unverified; replays and LAN need a sequence the project controls"
    referenced_by:
      - docs/architecture/adr-0001-sim-numeric-model.md
    added: 2026-11-01
    revised: ""

  - purpose: sim_checksum
    status: active
    api: SimHash.hash_words (word-wise, one XOR + wrapping multiply per int64)
    not: hash(), Object.get_instance_id()
    adr: docs/architecture/adr-0001-sim-numeric-model.md
    reason: "hash() is 32-bit with unverified cross-version stability; fallback is HashingContext over buffer.to_byte_array()"
    referenced_by:
      - docs/architecture/adr-0001-sim-numeric-model.md
    added: 2026-11-01
    revised: ""

  - purpose: sim_tick_driver
    status: active
    api: MatchRunner._process with an integer-microsecond accumulator, injected clock (default Time.get_ticks_usec), MAX_CATCHUP_TICKS cap and integer ticks_dropped
    not: _physics_process / physics_ticks_per_second, one tick per rendered frame
    adr: docs/architecture/adr-0002-sim-view-split.md
    reason: "LAN stalls, replay fast-forward and rollback need the step count under the game's control; exact 60 ticks per second with no drift on any monitor"
    referenced_by:
      - docs/architecture/adr-0002-sim-view-split.md
    added: 2026-11-01
    revised: ""

  - purpose: character_animation_drive
    status: active
    api: AnimationMixer.callback_mode_process = ANIMATION_CALLBACK_MODE_PROCESS_MANUAL, active = true, seek(anim_tick / 60.0, true)
    not: play() auto-advance, active = false, seek(t, false)
    adr: docs/architecture/adr-0002-sim-view-split.md
    reason: "Poses must be the exact keyed pose of the current sim tick (tested 121/121 ticks on 4.7.2); active = false and seek(t, false) leave the pose stale"
    referenced_by:
      - docs/architecture/adr-0002-sim-view-split.md
    added: 2026-11-01
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
