; Sprite frame table (design/art/sprite-spec-2d.md §3). Each anim lists one
; [first, last] tick range per drawing; the driver says which counter is used.
; loop = true wraps the counter over the summed ranges.
[canvas]
width=512
height=384
anchor_x=128
anchor_y=368
px_per_m=256

[idle]
driver="state"
loop=true
ranges=[[0, 7], [8, 15], [16, 23], [24, 31]]

[walk]
driver="state"
loop=true
ranges=[[0, 4], [5, 9], [10, 14], [15, 19], [20, 24], [25, 29]]

[light]
driver="move_frame"
loop=false
ranges=[[1, 2], [3, 5], [6, 8], [9, 11], [12, 14], [15, 16]]

[heavy]
driver="move_frame"
loop=false
ranges=[[1, 4], [5, 8], [9, 11], [12, 15], [16, 20], [21, 25], [26, 29]]

[block]
driver="state"
loop=false
ranges=[[0, 2], [3, 999999]]

[hit]
driver="state"
loop=false
ranges=[[0, 3], [4, 9], [10, 999999]]

[ko]
driver="tick"
loop=false
ranges=[[0, 5], [6, 11], [12, 19], [20, 999999]]
